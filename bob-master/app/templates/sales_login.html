<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Sales Audit · Advanced Marketers</title>
<link rel="icon" type="image/png" href="/reports/sales-audit/assets/favicon-64.png">
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --ring: rgba(11,11,11,.10); --risk: #b3203f; --font: Geist, "Geist Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --muted: #898781; --ring: rgba(255,255,255,.10); --risk: #ff8aa5; } .wordmark { filter: invert(1); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; padding: 20px; }
  .card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 28px 26px 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.06); }
  .wordmark { height: 22px; width: auto; display: block; margin-bottom: 6px; }
  .sub { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }
  label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
  input[type=password] { width: 100%; height: 40px; padding: 0 12px; background: var(--page); border: 1px solid var(--ring); border-radius: 9px; color: var(--ink); font: inherit; font-size: 15px; }
  input[type=password]:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  button { width: 100%; height: 40px; margin-top: 14px; border-radius: 9px; border: 1px solid var(--ink); background: var(--ink); color: var(--page); font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { opacity: .88; }
  .err { margin-top: 12px; font-size: 13px; color: var(--risk); }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <img class="wordmark" src="/reports/sales-audit/assets/wordmark-black.png" alt="Advanced Marketers" width="150" height="21">
    <div class="sub">Sales Audit</div>
    <form method="post" action="/reports/sales-audit/login" autocomplete="off">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="pw">Access password</label>
      <input id="pw" name="password" type="password" autofocus required autocomplete="current-password" aria-describedby="{% if error %}err{% endif %}">
      <button type="submit">Continue</button>
      {% if error %}<div class="err" id="err" role="alert">{{ error }}</div>{% endif %}
    </form>
    <div class="foot">Internal use only.</div>
  </main>
</body>
</html>
